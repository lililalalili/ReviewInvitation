[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nb-review-invitation-agent"
version = "0.1.0"
description = "Baseline refactor scaffold for NB review invitation workflow"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["nb_review_invitation_agent*"]
exclude = ["legacy*", "templates*", "tests*"]
